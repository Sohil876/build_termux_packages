name: Termux package

on:
    workflow_dispatch:
        inputs:
            package:
                description: "Package to build"
                required: true
                type: choice
                options:
                    - zeroclaw
                    # Add more packages here as you create them in the packages/ directory
                    # - my_other_package
                    # - another_tool
            version:
                description: "Version to build (e.g., 1.2.3). Leave blank for latest stable."
                required: false
                default: ""
                type: string
    # Commented out the push trigger.
    # If left active, pushing to main would trigger a build with an empty 'package' variable and fail.
    # push:
    #     branches:
    #         - main

jobs:
    build:
        # Safety net: ensures the job ONLY runs when manually triggered via the Actions UI
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                arch: [aarch64, arm]

        steps:
            - uses: actions/checkout@v7

            - name: Determine Version and Upstream Repo
              id: get_version
              run: |
                  PACKAGE="${{ github.event.inputs.package }}"
                  BUILD_SCRIPT="packages/$PACKAGE/build.sh"

                  if [ ! -f "$BUILD_SCRIPT" ]; then
                    echo "Error: Build script $BUILD_SCRIPT not found!"
                    exit 1
                  fi

                  # Extract GitHub homepage URL from build.sh to find the upstream repo
                  UPSTREAM_REPO=$(grep -m 1 "TERMUX_PKG_HOMEPAGE=" "$BUILD_SCRIPT" | sed -E 's/.*"https:\/\/github\.com\/([^"]+)".*/\1/' | sed 's/\/$//')

                  if [ -z "$UPSTREAM_REPO" ]; then
                    echo "Error: Could not extract GitHub repo from $BUILD_SCRIPT. Ensure TERMUX_PKG_HOMEPAGE is a GitHub URL."
                    exit 1
                  fi

                  echo "Upstream repo detected: $UPSTREAM_REPO"

                  if [ -z "${{ github.event.inputs.version }}" ]; then
                    # Fetches latest stable release (ignores pre-releases and drafts)
                    VERSION=$(curl -s "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest" | jq -r .tag_name | sed 's/^v//')
                    
                    # Fallback to tags if no official "releases" exist
                    if [ "$VERSION" = "null" ] || [ -z "$VERSION" ]; then
                      VERSION=$(curl -s "https://api.github.com/repos/$UPSTREAM_REPO/tags" | jq -r '.[0].name' | sed 's/^v//')
                    fi
                  else
                    VERSION="${{ github.event.inputs.version }}"
                  fi

                  echo "Building $PACKAGE version $VERSION"
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "package=$PACKAGE" >> $GITHUB_OUTPUT

            - name: Clone termux-packages
              run: git clone --recursive --single-branch -b master https://github.com/termux/termux-packages

            - name: Add ${{ steps.get_version.outputs.package }} package
              run: cp -r packages/${{ steps.get_version.outputs.package }} termux-packages/packages/

            - name: Update build.sh dynamically
              run: |
                  PACKAGE="${{ steps.get_version.outputs.package }}"
                  VERSION="${{ steps.get_version.outputs.version }}"
                  cd termux-packages/packages/$PACKAGE

                  # Extract GitHub repo from HOMEPAGE to construct the download URL
                  UPSTREAM_REPO=$(grep -m 1 "TERMUX_PKG_HOMEPAGE=" build.sh | sed -E 's/.*"https:\/\/github\.com\/([^"]+)".*/\1/' | sed 's/\/$//')

                  # Try downloading with 'v' prefix, then without (standard GitHub archive patterns)
                  wget -q -O source.tar.gz "https://github.com/$UPSTREAM_REPO/archive/refs/tags/v${VERSION}.tar.gz" || \
                  wget -q -O source.tar.gz "https://github.com/$UPSTREAM_REPO/archive/refs/tags/${VERSION}.tar.gz"

                  SHA256=$(sha256sum source.tar.gz | awk '{print $1}')
                  rm source.tar.gz

                  # Inject the discovered version and computed SHA256
                  sed -i "s/TERMUX_PKG_VERSION=.*/TERMUX_PKG_VERSION=${VERSION}/" build.sh
                  sed -i "s/TERMUX_PKG_SHA256=.*/TERMUX_PKG_SHA256=${SHA256}/" build.sh

            - name: Build package using Docker
              run: |
                  cd termux-packages
                  ./scripts/run-docker.sh ./build-package.sh -a ${{ matrix.arch }} ${{ steps.get_version.outputs.package }}

            - name: Inspect build output
              run: |
                  PACKAGE="${{ steps.get_version.outputs.package }}"
                  echo "=================================================="
                  echo "Termux packages build output is located at: termux-packages/output/"
                  echo "=================================================="
                  echo ""
                  echo "Listing contents of termux-packages/output/:"
                  ls -lh termux-packages/output/ || echo "Directory not found!"
                  echo ""
                  echo "=================================================="
                  echo "Finding all $PACKAGE .deb files in the workspace:"
                  echo "=================================================="
                  find . -type f -name "${PACKAGE}*.deb" -exec ls -lh {} \; || echo "No files found!"

            - name: Prepare artifacts
              run: |
                  PACKAGE="${{ steps.get_version.outputs.package }}"
                  mkdir -p artifacts
                  cp termux-packages/output/${PACKAGE}*.deb artifacts/ || echo "Warning: No $PACKAGE debs found in output directory."

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.get_version.outputs.package }}-${{ matrix.arch }}-v${{ steps.get_version.outputs.version }}
                  path: artifacts/
